name: Security Wire Autonomous Ingestion

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pydantic

      - name: Fetch and Process Vulnerabilities
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        run: |
          python ingest_security.py

      - name: Commit and push updates
        run: |
          git config user.name "sec-wire-bot[bot]"
          git config user.email "sec-wire-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No new updates."
          else
            git commit -m "chore: auto-refresh security intelligence [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
